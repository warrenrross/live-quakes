<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>live-quakes — real-time USGS earthquake map</title>
  <meta name="description" content="A modern Leaflet map of the last 30 days of USGS earthquakes, with a timeline scrubber and tectonic-plate overlay." />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet.timeline plugin (bundled locally) -->
  <link rel="stylesheet" href="static/css/leaflet.timeline.css" />

  <!-- Our styles -->
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="dot"></span>
      <strong>live-quakes</strong>
      <span class="subtitle">last 30 days · M ≥ 2.5 · USGS</span>
    </div>
    <a class="src" href="https://github.com/warrenrross/live-quakes" target="_blank" rel="noopener">Source ↗</a>
  </header>

  <div id="map-id"></div>

  <!-- Leaflet.timeline plugin scripts -->
  <script src="static/plugins/leaflet/timeline/IntervalTree.js"></script>
  <script src="static/plugins/leaflet/timeline/Timeline.js"></script>
  <script src="static/plugins/leaflet/timeline/TimelineSliderControl.js"></script>

  <!-- App -->
  <script src="static/js/logic.js"></script>
</body>
</html>
